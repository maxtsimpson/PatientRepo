apiVersion: apps/v1
kind: Deployment
metadata:
  name: patientrepo-api
  labels:
    app.kubernetes.io/name: patientrepo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patientrepo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patientrepo-api
    spec:
      securityContext:
        # aspnet images create an 'app' user (uid 1654, $APP_UID) but default
        # to root unless the Dockerfile has `USER $APP_UID`, so set it here
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
      containers:
        - name: api
          # tag is set in kustomization.yaml
          image: ghcr.io/maxtsimpson/patientrepo-api
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
